    const formatDateDDMMYY = (dateStr) => {
      if (!dateStr) return '-';
      const parts = String(dateStr).trim().split('-');
      if (parts.length === 3 && parts[0].length === 4) return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0].slice(-2)}`;
      return dateStr;
    };

    const getGDrivePreviewUrl = (url) => {
      if (!url) return null;
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://drive.google.com/file/d/${match[1]}/preview`;
      }
      return null;
    };

    const exportToExcel = (filename, rows, headers) => {
      if (typeof XLSX === 'undefined') {
         alert('Menunggu sistem Excel dimuat, coba klik sekali lagi.'); return;
      }
      const data = [headers, ...rows];
      const ws = XLSX.utils.aoa_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Data');
      XLSX.writeFile(wb, `${filename}.xlsx`);
    };

                  <div>

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [activeMenu, setActiveMenu] = useState('dashboard');
      const [searchQuery, setSearchQuery] = useState('');
      const [toastMessage, setToastMessage] = useState('');
      const [appData, setAppData] = useState(initialData);
      const [isMobileOpen, setIsMobileOpen] = useState(false);
      const [isCloudReady, setIsCloudReady] = useState(false);

      useEffect(() => {
        let unsubscribe = null;
        const initDB = async () => {
          try {
            const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            if (config && window.FirebaseMod) {
               const { initializeApp, getAuth, signInAnonymously, getFirestore, doc, setDoc, onSnapshot } = window.FirebaseMod;
               const app = initializeApp(config);
               await signInAnonymously(getAuth(app));
               const docRef = doc(getFirestore(app), 'artifacts', 'kurikulum-pabedilan', 'public', 'data', 'kurikulumState', 'mainDoc');
               window.firebaseSetDoc = setDoc; window.dbRef = docRef;
               
               unsubscribe = onSnapshot(docRef, (snap) => { 
                   if (snap.exists()) {
                       const cloudData = snap.data();
                       setAppData(prev => ({
                           ...initialData,
                           ...cloudData,
                           profil: { ...initialData.profil, ...(cloudData.profil || {}) },
                           dokumenSingle: { ...initialData.dokumenSingle, ...(cloudData.dokumenSingle || {}) }
                       }));
                   } else {
                       setDoc(docRef, initialData); 
                   }
                   setIsCloudReady(true); 
               });
               return; 
            }
          } catch(err) { console.warn("Cloud terhambat, beralih ke Lokal", err); }

          const localData = localStorage.getItem('kurikulumData_SMPN1Pabedilan');
          if (localData) {
             try {
                const parsed = JSON.parse(localData);
                setAppData(prev => ({
                   ...initialData, 
                   ...parsed,
                   profil: { ...initialData.profil, ...(parsed.profil || {}) },
                   dokumenSingle: { ...initialData.dokumenSingle, ...(parsed.dokumenSingle || {}) },
                   kegiatanSekolah: parsed.kegiatanSekolah || initialData.kegiatanSekolah,
                   guru: parsed.guru || initialData.guru,
                   rombel: parsed.rombel || initialData.rombel,
                   perangkat: parsed.perangkat || initialData.perangkat,
                   dokumentasi: parsed.dokumentasi || initialData.dokumentasi
                }));
             } catch(e) { console.warn("Struktur local storage kadaluarsa, mereset struktur..."); }
          }
        };
        initDB();
        return () => unsubscribe && unsubscribe();
      }, []);

      const handleSetData = (updater) => {
         setAppData((prev) => {
            const newData = typeof updater === 'function' ? updater(prev) : updater;
            if (window.firebaseSetDoc && window.dbRef) {
               window.firebaseSetDoc(window.dbRef, newData).catch(err => console.error(err));
            } else {
               localStorage.setItem('kurikulumData_SMPN1Pabedilan', JSON.stringify(newData)); 
            }
            return newData;
         });
      };
      
      const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(''), 3500); };

      if (!isAuthenticated) return <LoginScreen onLogin={() => setIsAuthenticated(true)} profil={appData.profil} />;

      const renderContent = () => {
        switch (activeMenu) {
          case 'kaldik': return <KaldikView data={appData} setData={handleSetData} showToast={showToast} searchQuery={searchQuery} />;
          case 'jadwal_pelajaran': return <JadwalPelajaranView data={appData} setData={handleSetData} />;
          case 'ksp': return <SimplePdfModule title="Dokumen KSP" docKey="ksp" icon="book" data={appData} setData={handleSetData} desc="Tempel link Google Drive dokumen KSP di bawah ini."/>;
          case 'rkt': return <SimplePdfModule title="Dokumen RKT & RKAS" docKey="rkt" icon="folder" data={appData} setData={handleSetData} desc="Tempel link Google Drive laporan/dokumen RKT & RKAS." />;
          case 'data_guru': return <DataGuruView data={appData} setData={handleSetData} showToast={showToast} searchQuery={searchQuery} />;
          case 'data_siswa': return <DataSiswaView data={appData} setData={handleSetData} showToast={showToast} searchQuery={searchQuery} />;
          case 'perangkat': return <PerangkatAjarView data={appData} searchQuery={searchQuery} />;
          case 'dokumentasi': return <DokumentasiView data={appData} setData={handleSetData} showToast={showToast} searchQuery={searchQuery} />;
          case 'profil_sekolah': return <ProfilSekolahView data={appData} setData={handleSetData} showToast={showToast} />;
          default: return <DashboardView data={appData} setActiveMenu={setActiveMenu} />;
        }
      };

      return (
        <div className="min-h-screen flex flex-col lg:flex-row font-sans text-gray-800" style={{ backgroundColor: clayColors.bgApp }}>
          <Sidebar activeMenu={activeMenu} setActiveMenu={(m) => { setActiveMenu(m); setSearchQuery(''); }} onLogout={() => setIsAuthenticated(false)} isMobileOpen={isMobileOpen} setIsMobileOpen={setIsMobileOpen} profil={appData.profil} />
          <main className="flex-1 min-h-screen p-4 sm:p-6 lg:p-8 overflow-y-auto relative">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 sticky top-0 z-20 py-3 bg-[#F7F4FD]/90 backdrop-blur-md">
              <div className="flex items-center space-x-3">
                <button onClick={() => setIsMobileOpen(!isMobileOpen)} className="lg:hidden p-3 bg-white rounded-2xl shadow-xs"><Icon name="menu" size={20} /></button>
                <div><h1 className="text-xl sm:text-2xl font-black text-gray-900 tracking-tight">{MENU_ITEMS.find(m => m.id === activeMenu)?.label || 'Dashboard'}</h1><p className="text-xs font-bold text-gray-500">{appData.profil?.namaSekolah || 'Sekolah'} • Portal Kurikulum</p></div>
              </div>
              <div className="flex items-center space-x-3 w-full sm:w-auto">
                <div className={`px-3 py-1.5 rounded-full text-[10px] font-black flex items-center shadow-inner ${isCloudReady ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}><Icon name="cloud" size={12} className="mr-1"/>{isCloudReady ? 'Cloud Sync' : 'Local Save'}</div>
                {['data_guru', 'data_siswa', 'perangkat', 'dokumentasi', 'kaldik'].includes(activeMenu) && (
                  <div className="relative flex-1 sm:w-64">
                    <Icon name="search" className="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400" size={16} />
                    <input type="text" placeholder="Cari data..." className="w-full pl-10 pr-8 py-3 rounded-full bg-white border border-purple-100 shadow-inner text-xs font-bold outline-none focus:border-[#9B7BEA]" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                    {searchQuery && <button onClick={() => setSearchQuery('')} className="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400"><Icon name="x" size={14} /></button>}
                  </div>
                )}
              </div>
            </div>
            <div className="pb-12">{renderContent()}</div>
          </main>
          <NotificationToast message={toastMessage} onClose={() => setToastMessage('')} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
